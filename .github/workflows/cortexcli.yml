name: CortexCLI Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
  
jobs:
  cortexcli:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
      
    runs-on: ubuntu-latest
    environment: Cortex
    env:
      CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
      CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
      CORTEX_API_BASE_URL: ${{ secrets.CORTEX_API_BASE_URL }}

    steps:
    # Initial Setup
    - name: Checkout
      uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5
      
    - name: Fetch Dismissed Code Alerts from GitHub
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Query GitHub API for dismissed alerts and combine paginated pages into a single JSON array
        gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "/repos/${{ github.repository }}/code-scanning/alerts?state=dismissed" \
          --paginate | jq -s 'add' > dismissed_alerts.json

        echo "Fetched $(jq 'length' dismissed_alerts.json) dismissed alerts."

    # Upload output as artifact
    - name: Upload Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: dismissed_alerts.json
        path: dismissed_alerts.json

    # Python script to match CortexCLI with GHAS
    - name: Apply Cortex Skip Directives
      run: | 
        python3 -c '
        import json, os
        from collections import defaultdict
  
        with open("dismissed_alerts.json") as f:
            alerts = json.load(f)
  
        cortex_alerts = [a for a in alerts if a.get("tool", {}).get("name") == "Cortex CLI"]
        file_groups = defaultdict(list)
  
        for a in cortex_alerts:
            path = a.get("most_recent_instance", {}).get("location", {}).get("path", "").lstrip("/")
            if path:
                file_groups[path].append(a)
  
        for path, alerts_list in file_groups.items():
            if not os.path.exists(path):
                continue
  
            # Sort descending by start_line
            alerts_list.sort(
                key=lambda x: x.get("most_recent_instance", {}).get("location", {}).get("start_line", 0),
                reverse=True
            )
  
            with open(path, "r", encoding="utf-8") as f:
                lines = f.readlines()
  
            for alert in alerts_list:
                rule_id = alert.get("rule", {}).get("id", "")
                login = alert.get("dismissed_by", {}).get("login", "") if alert.get("dismissed_by") else ""
                reason = alert.get("dismissed_reason", "") or ""
                comment = alert.get("dismissed_comment") or ""
  
                comment_str = f"{login} - {reason}" + (f" - {comment}" if comment else "")
                skip_line = f"# cortex:skip={rule_id}: {comment_str}\n"
                prefix = f"# cortex:skip={rule_id}:"
  
                start_line = alert.get("most_recent_instance", {}).get("location", {}).get("start_line", 1)
                idx = start_line - 1
  
                if 0 <= idx < len(lines):
                    if lines[idx].strip().startswith(prefix):
                        lines[idx] = skip_line
                    else:
                        lines.insert(idx, skip_line)
                elif idx >= len(lines):
                    lines.append(skip_line)
  
            with open(path, "w", encoding="utf-8") as f:
                f.writelines(lines)
        '
        

    - name: Download cortexcli
      run: |
        crtx_resp=$(curl -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" -H "Authorization: ${CORTEX_API_KEY}" "${CORTEX_API_BASE_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64")
        crtx_url=$(echo $crtx_resp | jq -r ".signed_url")
        curl -o cortexcli $crtx_url
        chmod +x cortexcli
        ./cortexcli --version
        
    # Do AppSec Code Scanning
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 22

    - name: Verify Node.js Version
      run: node -v
      
    - name: Run Cortex CLI Code Scan
      run: |
        EXIT_CODE=0
        ./cortexcli \
          code scan \
          --directory "${{github.workspace}}" \
          --repo-id "${{github.repository}}" \
          --branch "${{github.ref_name}}" \
          --source "GITHUB_ACTIONS" \
          --create-repo-if-missing \
          --output sarif \
          --output-file-path "results.sarif" || EXIT_CODE=$?
        echo "Improve output"
        jq '(.runs[].tool.driver.rules[]? | select(.helpUri != null)) |= (.help.markdown = (.help.text + "\n\n**More Info:** [Rule Reference](" + .helpUri + ")"))' results.sarif > tmp-results.sarif
        jq '(.runs[].results[]?.suppressions[]?.kind) = "external"' tmp-results.sarif > results.sarif
        exit $EXIT_CODE
          
    # Handle the SARIF results
    - name: Upload SARIF file
      id: upload
      uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
      if: success() || failure()
      with:
        sarif_file: results.sarif
        wait-for-processing: true
        
    # Upload output as artifact
    - name: Upload Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: success() || failure()
      with:
        name: results
        path: results.sarif
        
    - name: Dismiss alerts
      #if: github.ref == 'refs/heads/main'
      if: success() || failure()
      uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8
      with:
        # specify a 'sarif-id' and directory containing SARIF files
        sarif-id: ${{ steps.upload.outputs.sarif-id }}
        sarif-file: results.sarif
      env:
        GITHUB_TOKEN: ${{ github.token }}   
    
