name: CortexCLI Scan

permissions:
  id-token: write      # Your custom permission
  contents: read       # REQUIRED for actions/checkout

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    
jobs:
  cortexcli:
    runs-on: ubuntu-latest
    environment: Cortex
    env:
      IMAGE_NAME: "twistlock-updater:latest"

    steps:
    # Initial Setup
    - name: Checkout
      uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5

    - name: Build Image
      run: |
        docker build -t $IMAGE_NAME .

    - name: Cortex Container Scan
      uses: PaloAltoNetworks/cortex-cloud-scan@3a5f413ae5a63d0da6d069eca9e628fece0603a7
      with:
        scan-type: image
        api-base-url: ${{ secrets.CORTEX_API_BASE_URL }}
        api-key: ${{ secrets.CORTEX_API_KEY }}
        api-key-id: ${{ secrets.CORTEX_API_KEY_ID }}
        image: ${{ env.IMAGE_NAME }}
